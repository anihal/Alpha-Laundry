[pytest]
testpaths = tests
pythonpath = laundry_app
addopts =
    --cov=laundry_app
    --cov-report=term-missing
    -ra
markers =
    unit: no Flask app, no test_client, no HTTP -- applied to everything under tests/unit/
    integration: exercises the whole stack -- applied to everything under tests/integration/
filterwarnings =
    ignore::DeprecationWarning
