name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.14.2
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  unit:
    name: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r laundry_app/requirements.txt pytest pytest-cov
      - name: Run unit tests
        run: pytest -m unit --no-cov -q

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install dependencies
        run: pip install -r laundry_app/requirements.txt pytest pytest-cov
      - name: Run integration tests
        run: pytest -m integration --no-cov -q

  coverage:
    name: coverage
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install dependencies
        run: pip install -r laundry_app/requirements.txt pytest pytest-cov
      - name: Run full suite with coverage gate
        run: |
          pytest \
            --cov=laundry_app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            | tee coverage-output.txt
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            sed -n '/^Name/,/^TOTAL/p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      # Non-blocking for now: the pinned Werkzeug 3.0.1 has three known
      # advisories, so this would fail every PR until that upgrade lands.
      # Flip `continue-on-error` to false once dependencies are current.
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pip-audit -r laundry_app/requirements.txt --desc 2>&1 | tee audit.txt
      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## Dependency audit"
            echo ""
            if [ "${{ steps.audit.outcome }}" = "failure" ]; then
              echo "> Known advisories found (non-blocking)."
              echo ""
            fi
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Single aggregate check. Require ONLY this one in branch protection so the
  # matrix can change without anyone editing the ruleset.
  ci-required:
    name: ci-required
    if: always()
    needs: [lint, unit, integration, coverage, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all upstream jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: All checks passed
        run: echo "lint, unit, integration, coverage and security all succeeded."
